name: shredmembers
description: shredMembers – Modern Fitness Tracking App
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Backend
  supabase_flutter: ^2.8.0

  # Utils
  uuid: ^4.4.0
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  equatable: ^2.0.5

  # Confetti
  confetti: ^0.7.0

  # Icons
  cupertino_icons: ^1.0.8

  # Share
  share_plus: ^10.1.4
  path_provider: ^2.1.5

  # Payment / Web
  url_launcher: ^6.2.5

  # Notifications + Background tasks
  flutter_local_notifications: ^17.2.4
  workmanager: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo/
