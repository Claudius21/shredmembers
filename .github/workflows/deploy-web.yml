name: Deploy Web

on:
  push:
    branches:
      - main

jobs:
  deploy-web:
    name: Build and Deploy Flutter Web + Landing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Supabase config from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p lib/src/services
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')
          ANON=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          cat > lib/src/services/supabase_config.dart <<EOF
          abstract final class SupabaseConfig {
            static const String url = '${URL}';
            static const String anonKey = '${ANON}';
          }
          EOF

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Flutter web app
        run: flutter build web --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project shredmembers
