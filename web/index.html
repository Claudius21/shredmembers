<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShredMembers - Modern Fitness Tracking App">
  <title>ShredMembers</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-surface: #111111;
      --color-text: #f5f5f5;
      --color-muted: #9ca3af;
      --color-accent: #22c55e;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }
    h1 {
      font-size: 3rem;
      margin: 0 0 1rem;
      letter-spacing: -0.02em;
    }
    h1 span {
      color: var(--color-accent);
    }
    p {
      color: var(--color-muted);
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    a {
      color: var(--color-accent);
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border: 1px solid var(--color-accent);
      border-radius: 8px;
      transition: all 0.2s;
    }
    a:hover {
      background: var(--color-accent);
      color: var(--color-bg);
    }
    .footer {
      margin-top: 3rem;
      color: var(--color-muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Shred<span>Members</span></h1>
    <p>Your modern fitness tracking companion. Track workouts, build plans, and reach your goals.</p>
    <div class="links">
      <a href="/privacy-policy">Privacy Policy</a>
      <a href="mailto:support@shredmember.app">Contact</a>
    </div>
    <div class="footer">
      <p>&copy; 2026 ShredMembers. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
