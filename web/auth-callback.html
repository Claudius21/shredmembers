<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShredMembers - Authentication</title>
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-text: #f5f5f5;
      --color-muted: #9ca3af;
      --color-accent: #22c55e;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      padding: 2rem;
      max-width: 500px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    p {
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    a {
      color: var(--color-accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .error {
      color: #ef4444;
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <h1>ShredMembers</h1>
    <p id="message">Redirecting to app...</p>
  </div>

  <script>
    function getParams() {
      const params = new URLSearchParams(window.location.search);
      // Supabase can also pass tokens in the URL fragment
      if (window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        hashParams.forEach((value, key) => params.set(key, value));
      }
      return params;
    }

    function redirectToApp() {
      const params = getParams();
      
      // Check for auth-related parameters
      const hasAuthParams = params.has('token') || 
                           params.has('access_token') || 
                           params.has('refresh_token') || 
                           params.has('code') ||
                           params.has('type');
      
      if (!hasAuthParams) {
        document.getElementById('message').textContent = 'No authentication parameters found.';
        document.getElementById('message').className = 'error';
        return;
      }

      // Build deep link to app
      const deepLink = new URL('shredmembers://auth/callback');
      params.forEach((value, key) => {
        deepLink.searchParams.append(key, value);
      });

      // Redirect to app
      window.location.href = deepLink.toString();

      // Fallback message after a short delay
      setTimeout(() => {
        document.getElementById('message').innerHTML = 
          'If the app did not open, <a href="' + deepLink.toString() + '">click here</a>.';
      }, 2000);
    }

    redirectToApp();
  </script>
</body>
</html>
