<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahlung abgebrochen - shredMembers</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 420px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: #b0b0b0; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 16px 24px;
      border-radius: 12px;
      background: #00e676;
      color: #0d0d0d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">❌</div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <a class="btn" href="/" id="btn-back"></a>
  </div>

  <script>
    var T = {
      de: { title: 'Zahlung abgebrochen', subtitle: 'Du hast den Checkout-Vorgang abgebrochen. Dein Test- oder Kundenkonto bleibt unverändert.', btn: 'Zurück zur Startseite' },
      en: { title: 'Payment cancelled', subtitle: 'You cancelled the checkout. Your trial or account remains unchanged.', btn: 'Back to home' },
      fr: { title: 'Paiement annulé', subtitle: 'Tu as annulé le paiement. Ton essai ou compte reste inchangé.', btn: 'Retour à l\'accueil' },
      it: { title: 'Pagamento annullato', subtitle: 'Hai annullato il pagamento. Il tuo account di prova rimane invariato.', btn: 'Torna alla home' },
    };
    var lang = (navigator.language || 'de').toLowerCase().substring(0, 2);
    var t = T[lang] || T['de'];
    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('btn-back').textContent = t.btn;
  </script>
</body>
</html>
