<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahlung abgebrochen - shredMembers</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 420px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: #b0b0b0; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 16px 24px;
      border-radius: 12px;
      background: #00e676;
      color: #0d0d0d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">❌</div>
    <h1>Zahlung abgebrochen</h1>
    <p>Du hast den Checkout-Vorgang abgebrochen. Dein Test- oder Kundenkonto bleibt unverändert.</p>
    <a class="btn" href="/">Zurück zur Startseite</a>
  </div>
</body>
</html>
