<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shredMembers</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-surface: #111111;
      --color-text: #f5f5f5;
      --color-text-muted: #9ca3af;
      --color-accent: #00E5A0;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 540px;
      width: 100%;
      background: var(--color-surface);
      border: 1px solid #222;
      border-radius: 20px;
      padding: 40px 28px;
    }
    .lang-switch {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .lang-switch button {
      background: transparent;
      border: 1px solid #333;
      color: var(--color-text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.875rem;
    }
    .lang-switch button.active,
    .lang-switch button:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }
    .logo {
      width: 64px; height: 64px;
      background: var(--color-accent);
      border-radius: 16px;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: bold; color: #0a0a0a;
    }
    h1 { font-size: 1.75rem; margin-bottom: 16px; }
    p { color: var(--color-text-muted); margin-bottom: 20px; line-height: 1.6; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    a { color: var(--color-accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .btn {
      display: inline-block;
      margin-top: 8px;
      padding: 14px 24px;
      border: 1px solid var(--color-accent);
      border-radius: 12px;
      color: var(--color-accent);
      background: transparent;
      text-decoration: none;
      font-weight: 600;
    }
    .btn:hover { background: rgba(0, 229, 160, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="lang-switch">
      <button data-lang="de" class="active">DE</button>
      <button data-lang="en">EN</button>
      <button data-lang="fr">FR</button>
      <button data-lang="it">IT</button>
      <button data-lang="es">ES</button>
    </div>
    <div class="logo">S</div>
    <div class="icon">🧪</div>
    <h1 data-i18n="titleAndroid">shredMembers für Android</h1>
    <p data-i18n="messageAndroid">Die mobile App befindet sich aktuell in einer Testphase. Wir informieren dich, sobald die App im Google Play Store verfügbar ist.</p>
    <a href="/" class="btn" data-i18n="backHome">Zurück zur Startseite</a>
  </div>

  <script>
    const messages = {
      de: {
        titleAndroid: 'shredMembers für Android',
        messageAndroid: 'Die mobile App befindet sich aktuell in einer Testphase. Wir informieren dich, sobald die App im Google Play Store verfügbar ist.',
        backHome: 'Zurück zur Startseite',
      },
      en: {
        titleAndroid: 'shredMembers for Android',
        messageAndroid: 'The mobile app is currently in a testing phase. We will notify you as soon as the app is available on the Google Play Store.',
        backHome: 'Back to home page',
      },
      fr: {
        titleAndroid: 'shredMembers pour Android',
        messageAndroid: "L'application mobile est actuellement en phase de test. Nous vous informerons dès qu'elle sera disponible sur Google Play Store.",
        backHome: "Retour à la page d'accueil",
      },
      it: {
        titleAndroid: 'shredMembers per Android',
        messageAndroid: "L'app mobile è attualmente in fase di test. Ti informeremo non appena sarà disponibile su Google Play Store.",
        backHome: 'Torna alla home page',
      },
      es: {
        titleAndroid: 'shredMembers para Android',
        messageAndroid: 'La aplicación móvil se encuentra actualmente en fase de prueba. Te informaremos tan pronto como esté disponible en Google Play Store.',
        backHome: 'Volver a la página de inicio',
      },
    };

    function setLang(lang) {
      const m = messages[lang] || messages.de;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (m[key]) el.textContent = m[key];
      });
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang-switch button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
      localStorage.setItem('shredmembers-lang', lang);
    }

    document.querySelectorAll('.lang-switch button').forEach(btn => {
      btn.addEventListener('click', () => setLang(btn.dataset.lang));
    });

    const savedLang = localStorage.getItem('shredmembers-lang');
    const browserLang = (navigator.language || 'de').toLowerCase().substring(0, 2);
    setLang(savedLang || browserLang || 'de');
  </script>
</body>
</html>
