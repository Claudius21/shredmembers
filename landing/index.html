<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shredMembers - Upgrade</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 420px;
      width: 100%;
    }
    .logo {
      width: 64px;
      height: 64px;
      background: #00e676;
      border-radius: 16px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: #0d0d0d;
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: #b0b0b0; margin-bottom: 32px; line-height: 1.5; }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 24px;
      text-align: left;
    }
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #0d0d0d;
      color: #fff;
      font-size: 16px;
      margin-bottom: 16px;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #00e676;
      color: #0d0d0d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: transparent;
      border: 1px solid #00e676;
      color: #00e676;
      margin-top: 12px;
    }
    .message {
      margin-top: 16px;
      font-size: 14px;
      color: #ff5252;
      text-align: center;
    }
    .success { color: #00e676; }
    .stores {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .store-link {
      color: #00e676;
      text-decoration: underline;
      font-size: 14px;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #0d0d0d;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none; }
    .plans { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }
    .plan {
      background: #0d0d0d;
      border: 2px solid #333;
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
    }
    .plan.active { border-color: #00e676; }
    .plan-title { font-weight: bold; margin-bottom: 4px; }
    .plan-price { color: #00e676; font-size: 22px; font-weight: bold; }
    .plan-period { color: #b0b0b0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">S</div>
    <h1>shredMembers Pro</h1>
    <p class="subtitle">Voller Zugriff auf alle Trainingspläne, Progress-Tracking und Premium-Features.</p>

    <!-- Step 1: Email -->
    <div id="step-email" class="card">
      <label for="email" style="display:block; margin-bottom:8px; color:#b0b0b0;">E-Mail-Adresse</label>
      <input type="email" id="email" placeholder="deine@email.com" />
      <button class="btn" id="btn-email">Magic Link senden</button>
      <div class="message" id="msg-email"></div>
    </div>

    <!-- Step 2: Plan selection -->
    <div id="step-plan" class="card hidden">
      <p style="margin-bottom:16px; color:#b0b0b0;">Angemeldet als <strong id="user-email" style="color:#fff;"></strong></p>
      <p id="trial-info" style="display:none; margin-bottom:16px; font-size:13px; color:#00e676; text-align:center;"></p>
      <div class="plans" id="plans">
        <div class="plan" data-price="monthly">
          <div class="plan-title">Monatlich</div>
          <div class="plan-price">9,99 €</div>
          <div class="plan-period">pro Monat</div>
        </div>
        <div class="plan active" data-price="yearly">
          <div class="plan-title">Jährlich</div>
          <div class="plan-price">89,99 €</div>
          <div class="plan-period">pro Jahr · 30% günstiger</div>
        </div>
      </div>
      <button class="btn" id="btn-checkout">Jetzt upgraden</button>
      <p style="text-align:center; margin-top:12px; font-size:13px; color:#b0b0b0;">oder <a id="btn-trial" href="#" style="color:#00e676; text-decoration:underline;">30 Tage kostenlos testen</a><span id="trial-link-suffix"> – kein Abo nötig</span></p>
      <button class="btn btn-secondary" id="btn-logout">Andere E-Mail verwenden</button>
      <div class="message" id="msg-plan"></div>
      <div class="stores hidden" id="store-links">
        <a class="store-link" href="#" id="ios-link" target="_blank" rel="noopener">Im App Store herunterladen</a>
        <a class="store-link" href="#" id="android-link" target="_blank" rel="noopener">Bei Google Play herunterladen</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
