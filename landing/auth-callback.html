<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shredMembers – Signing in...</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 420px; width: 100%; }
    .logo {
      width: 64px; height: 64px;
      background: #00E5A0;
      border-radius: 16px;
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: bold; color: #0d0d0d;
    }
    h1 { font-size: 24px; margin-bottom: 12px; }
    .status { color: #b0b0b0; margin-bottom: 24px; line-height: 1.5; font-size: 15px; }
    .spinner {
      display: inline-block;
      width: 32px; height: 32px;
      border: 3px solid #333;
      border-top-color: #00E5A0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block;
      padding: 14px 24px;
      border: none; border-radius: 12px;
      background: #00E5A0;
      color: #0d0d0d;
      font-size: 16px; font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #00E5A0;
      color: #00E5A0;
      margin-top: 12px;
    }
    .hidden { display: none; }
    .error { color: #ff5252; }
    .success { color: #00E5A0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚡</div>
    <h1>shredMembers</h1>

    <!-- Loading state -->
    <div id="state-loading">
      <div class="spinner"></div>
      <p class="status">Signing you in...</p>
    </div>

    <!-- Success: app opened -->
    <div id="state-success" class="hidden">
      <p class="status success">✓ Signed in successfully!</p>
      <p class="status">If the app didn't open automatically:</p>
      <a id="btn-open-app" href="#" class="btn">Open App</a>
      <br>
      <a id="btn-web-app" href="https://web.shredmember.app" class="btn btn-secondary">Open Web App</a>
    </div>

    <!-- Error state -->
    <div id="state-error" class="hidden">
      <p class="status error" id="error-msg">Something went wrong.</p>
      <a href="https://shredmember.app" class="btn btn-secondary">Back to shredmember.app</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    var SUPABASE_URL = 'https://xcgfzunpvremqdlamvbw.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjZ2Z6dW5wdnJlbXFkbGFtdmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTI4MTYsImV4cCI6MjA5NjI2ODgxNn0.AOI3_v-HJp2DpAd2uLv-4cvqUYKJ8wVMPQBqJFQ3mj4';
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    var stateLoading = document.getElementById('state-loading');
    var stateSuccess = document.getElementById('state-success');
    var stateError = document.getElementById('state-error');
    var errorMsg = document.getElementById('error-msg');
    var btnOpenApp = document.getElementById('btn-open-app');
    var btnWebApp = document.getElementById('btn-web-app');

    function showState(state) {
      stateLoading.classList.add('hidden');
      stateSuccess.classList.add('hidden');
      stateError.classList.add('hidden');
      state.classList.remove('hidden');
    }

    function tryOpenApp(session) {
      // Build the deep link with session tokens
      var deepLink = 'shredmembers://auth/callback'
        + '?access_token=' + encodeURIComponent(session.access_token)
        + '&refresh_token=' + encodeURIComponent(session.refresh_token);

      btnOpenApp.href = deepLink;

      // Try to open the app via custom scheme
      // If it fails (no app installed), the user stays on this page
      var appOpened = false;
      window.addEventListener('blur', function() { appOpened = true; });

      window.location.href = deepLink;

      // After a short delay, if we're still here, show the fallback UI
      setTimeout(function() {
        showState(stateSuccess);
      }, 1500);
    }

    async function init() {
      try {
        // Supabase client automatically picks up the tokens from the URL hash
        var { data, error } = await supabaseClient.auth.getSession();

        if (error) {
          console.error('[AUTH-CB] session error:', error);
          errorMsg.textContent = error.message || 'Authentication failed.';
          showState(stateError);
          return;
        }

        if (data?.session) {
          console.log('[AUTH-CB] session established for:', data.session.user.email);
          // Clean up URL hash
          window.history.replaceState({}, document.title, window.location.pathname);
          // Try to open the native app
          tryOpenApp(data.session);
        } else {
          errorMsg.textContent = 'No session found. The link may have expired.';
          showState(stateError);
        }
      } catch (e) {
        console.error('[AUTH-CB] error:', e);
        errorMsg.textContent = 'Error: ' + (e.message || e);
        showState(stateError);
      }
    }

    init();
  </script>
</body>
</html>
