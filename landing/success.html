<!DOCTYPE html>
<html lang="de">
<head>

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 420px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: #b0b0b0; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 16px 24px;
      border-radius: 12px;
      background: #00e676;
      color: #0d0d0d;
      text-decoration: none;
      font-weight: bold;
    }
    .stores {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .store-link {
      color: #00e676;
      text-decoration: underline;
      font-size: 14px;
    }
    .error { color: #ff5252; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✅</div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <p id="open-hint"></p>
    <a class="btn" href="shredmembers://" id="btn-open"></a>
    <div class="stores">
      <a class="store-link" href="#" id="ios-link"></a>
      <a class="store-link" href="#" id="android-link"></a>
    </div>
    <div class="error" id="error"></div>
  </div>

  <script>
    var T = {
      de: { title: 'Zahlung erfolgreich!', subtitle: 'Danke für dein Vertrauen. Dein shredMembers Pro Abonnement ist jetzt aktiv.', hint: 'Öffne die App, um alle Premium-Features zu nutzen.', btn: 'App öffnen', ios: 'Im App Store herunterladen', android: 'Bei Google Play herunterladen', err: 'Fehler beim Aktivieren: ' },
      en: { title: 'Payment successful!', subtitle: 'Thank you for your trust. Your shredMembers Pro subscription is now active.', hint: 'Open the app to use all premium features.', btn: 'Open app', ios: 'Download on the App Store', android: 'Get it on Google Play', err: 'Activation error: ' },
      fr: { title: 'Paiement réussi !', subtitle: 'Merci pour ta confiance. Ton abonnement shredMembers Pro est maintenant actif.', hint: 'Ouvre l\'app pour accéder à toutes les fonctionnalités premium.', btn: 'Ouvrir l\'app', ios: 'Télécharger sur l\'App Store', android: 'Disponible sur Google Play', err: 'Erreur d\'activation: ' },
      it: { title: 'Pagamento riuscito!', subtitle: 'Grazie per la tua fiducia. Il tuo abbonamento shredMembers Pro è ora attivo.', hint: 'Apri l\'app per utilizzare tutte le funzionalità premium.', btn: 'Apri l\'app', ios: 'Scarica su App Store', android: 'Disponibile su Google Play', err: 'Errore di attivazione: ' },
    };
    var lang = (navigator.language || 'de').toLowerCase().substring(0, 2);
    var t = T[lang] || T['de'];
    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('open-hint').textContent = t.hint;
    document.getElementById('btn-open').textContent = t.btn;
    document.getElementById('ios-link').textContent = t.ios;
    document.getElementById('android-link').textContent = t.android;

    var SUPABASE_URL = 'https://xcgfzunpvremqdlamvbw.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjZ2Z6dW5wdnJlbXFkbGFtdmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTI4MTYsImV4cCI6MjA5NjI2ODgxNn0.AOI3_v-HJp2DpAd2uLv-4cvqUYKJ8wVMPQBqJFQ3mj4';
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function confirmPayment() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      if (!sessionId) return;

      const { error } = await supabaseClient.functions.invoke('stripe-confirm-payment', {
        body: { sessionId },
      });

      if (error) {
        document.getElementById('error').textContent = t.err + error.message;
      }
    }

    confirmPayment();
  </script>
</body>
</html>
