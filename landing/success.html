<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahlung erfolgreich - shredMembers</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d0d;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 420px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { color: #b0b0b0; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 16px 24px;
      border-radius: 12px;
      background: #00e676;
      color: #0d0d0d;
      text-decoration: none;
      font-weight: bold;
    }
    .stores {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .store-link {
      color: #00e676;
      text-decoration: underline;
      font-size: 14px;
    }
    .error { color: #ff5252; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">✅</div>
    <h1>Zahlung erfolgreich!</h1>
    <p>Danke für dein Vertrauen. Dein shredMembers Pro Abonnement ist jetzt aktiv.</p>
    <p>Öffne die App, um alle Premium-Features zu nutzen.</p>
    <a class="btn" href="shredmembers://">App öffnen</a>
    <div class="stores">
      <a class="store-link" href="#" id="ios-link">Im App Store herunterladen</a>
      <a class="store-link" href="#" id="android-link">Bei Google Play herunterladen</a>
    </div>
    <div class="error" id="error"></div>
  </div>

  <script>
    var SUPABASE_URL = 'https://xcgfzunpvremqdlamvbw.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjZ2Z6dW5wdnJlbXFkbGFtdmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2OTI4MTYsImV4cCI6MjA5NjI2ODgxNn0.AOI3_v-HJp2DpAd2uLv-4cvqUYKJ8wVMPQBqJFQ3mj4';
    var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function confirmPayment() {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      if (!sessionId) return;

      const { error } = await supabaseClient.functions.invoke('stripe-confirm-payment', {
        body: { sessionId },
      });

      if (error) {
        document.getElementById('error').textContent = 'Fehler beim Aktivieren: ' + error.message;
      }
    }

    confirmPayment();
  </script>
