<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1024px;
  height: 500px;
  background: #121212;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow: hidden;
}
.logo {
  width: 180px;
  height: 180px;
  background: #1a1a1a;
  border-radius: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bolt {
  width: 100px;
  height: 140px;
}
.text {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.app-name {
  font-size: 56px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -1px;
}
.tagline {
  font-size: 28px;
  font-weight: 400;
  color: #00E5A0;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
  <div class="logo">
    <svg class="bolt" viewBox="0 0 24 24" fill="none">
      <polygon points="13,2 3,14 12,14 11,22 21,10 12,10" fill="#00E5A0"/>
    </svg>
  </div>
  <div class="text">
    <div class="app-name">shredMembers</div>
    <div class="tagline">Train smarter.</div>
  </div>
</body>
</html>
