<table width="100%" cellpadding="0" cellspacing="0" style="background:#0d0d0d;padding:40px 20px;">

      <table width="420" cellpadding="0" cellspacing="0" style="background:#1a1a1a;border-radius:16px;padding:40px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <!-- Logo -->
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <div style="width:56px;height:56px;background:#00E5A0;border-radius:14px;display:inline-block;line-height:56px;font-size:28px;font-weight:bold;color:#0d0d0d;">⚡</div>
          </td>
        </tr>
        <!-- Title -->
        <tr>
          <td align="center" style="font-size:24px;font-weight:800;color:#ffffff;padding-bottom:8px;">
